name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore InfiniteCanvasWPF.slnx

      - name: Build solution
        run: dotnet build InfiniteCanvasWPF.slnx --configuration Release --no-restore

      - name: Test core projects
        run: dotnet test tests/InfiniteCanvas.Tests/InfiniteCanvas.Tests.csproj --configuration Release --no-build --no-restore

      - name: Test Windows projects
        run: dotnet test tests/InfiniteCanvas.Windows.Tests/InfiniteCanvas.Windows.Tests.csproj --configuration Release --no-build --no-restore

      - name: Build benchmark projects
        run: dotnet build benchmarks/InfiniteCanvas.Benchmarks/InfiniteCanvas.Benchmarks.csproj --configuration Release --no-restore

      - name: Validate task tracker
        shell: pwsh
        run: ./scripts/Validate-TaskTracker.ps1 -Path docs/tasks

      - name: Check whitespace
        shell: pwsh
        run: |
          $base = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            '${{ github.event.pull_request.base.sha }}'
          } else {
            '${{ github.event.before }}'
          }

          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            git diff --check HEAD^ HEAD
          } else {
            git diff --check "$base...HEAD"
          }